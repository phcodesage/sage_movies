<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <meta name="theme-color" content="#0f1015" />
    <title>You're offline | Sage Movies</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        background: #141414;
        color: #fff;
        font:
          17px/1.6 system-ui,
          sans-serif;
        padding: 24px;
      }
      main {
        max-width: 420px;
        text-align: center;
      }
      img {
        border-radius: 24px;
      }
      h1 {
        line-height: 1.2;
      }
      p {
        color: #bdbdbd;
      }
      a {
        display: inline-block;
        background: #ffe600;
        color: #111;
        font-weight: 700;
        padding: 12px 24px;
        border-radius: 8px;
        text-decoration: none;
      }
      :focus-visible {
        outline: 3px solid white;
        outline-offset: 4px;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon-192.png" width="96" height="96" alt="Sage Movies" />
      <h1>You're offline</h1>
      <p>
        Connect to the internet to browse titles and play videos. Your watch history stays on this
        device.
      </p>
      <a href="/">Try again</a>
    </main>
  </body>
</html>
